sonar.projectKey=real-time-sales-devops
sonar.projectName=Real-Time Sales DevOps TP

# Code analysé (bugs, vulnérabilités, code smells, duplications)
sonar.sources=app,spark
sonar.tests=tests
sonar.python.version=3.11

# Couverture produite par pytest-cov dans le Jenkinsfile
sonar.python.coverage.reportPaths=coverage.xml

# Le job Spark n'est couvert que par les tests d'intégration/E2E (services réels) :
# on l'analyse, mais on l'exclut du calcul de couverture des tests unitaires.
sonar.coverage.exclusions=spark/**

sonar.exclusions=**/__pycache__/**,**/.pytest_cache/**,.venv/**
